{% extends "plans/base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8">
            <h1>Editar Perfil</h1>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                <a href="{% url 'athlete-dashboard' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
