{% extends "plans/base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="alert alert-danger">
        <h1 class="display-4">✗ Error de Pago</h1>
        <p class="lead">No pudimos procesar tu pago.</p>
        {% if error_message %}
        <p>{{ error_message }}</p>
        {% endif %}
        <a href="{% url 'checkout' %}" class="btn btn-primary btn-lg mt-3">Intentar de Nuevo</a>
        <a href="/" class="btn btn-secondary btn-lg mt-3">Cancelar</a>
    </div>
</div>
{% endblock %}
