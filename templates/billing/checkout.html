{% extends "plans/base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8">
            <h1>Carrito de Compra</h1>
            <table class="table">
                <thead>
                    <tr>
                        <th>Plan</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>{{ plan.name }}</td>
                        <td>${{ plan.price_monthly }}</td>
                        <td>1</td>
                        <td>${{ plan.price_monthly }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5>Resumen</h5>
                    <p>Subtotal: ${{ plan.price_monthly }}</p>
                    <p>Impuestos: $0</p>
                    <h4>Total: ${{ plan.price_monthly }}</h4>
                    <form method="post" action="{% url 'billing:payment-process' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-success btn-block">Proceder al Pago</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
