{% extends "plans/base.html" %}
{% block content %}
<div class="container mt-5">
    <h1>Mis Facturas</h1>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Número</th>
                <th>Fecha</th>
                <th>Monto</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            {% for payment in payments %}
            <tr>
                <td>#{{ payment.id }}</td>
                <td>{{ payment.created_at|date:"d/m/Y" }}</td>
                <td>${{ payment.amount }}</td>
                <td><span class="badge badge-{{ payment.status|lower }}">{{ payment.get_status_display }}</span></td>
                <td><a href="{% url 'billing:invoice-detail' payment.id %}" class="btn btn-sm btn-primary">Ver</a></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-muted text-center">Sin facturas</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
