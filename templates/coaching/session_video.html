{% extends "plans/base.html" %}
{% block content %}
<div class="container-fluid mt-5">
    <div class="row">
        <div class="col-md-8">
            <div id="video-container" style="background: #000; height: 600px;">
                {% if session.meeting_url %}
                <iframe id="zoomframe" src="{{ session.meeting_url }}" style="width: 100%; height: 100%;"></iframe>
                {% else %}
                <p class="text-white text-center mt-5">Link de sesión no disponible</p>
                {% endif %}
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5>{{ session.coach.full_name }}</h5>
                    <p>{{ session.get_session_type_display }}</p>
                    <p>Duración: {{ session.duration_min }} min</p>
                    <p>Inicio: {{ session.scheduled_at }}</p>
                    <div id="chat" style="height: 400px; border: 1px solid #ddd;"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
